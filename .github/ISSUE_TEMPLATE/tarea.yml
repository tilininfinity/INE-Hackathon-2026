name: Tarea
description: Trabajo concreto por hacer.
title: "[Tarea] "
labels: ["tarea"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Datos
        - Narrativa
        - Diseño
        - Web / prototipo
        - Entregable
        - Difusión
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué hay que hacer?
    validations:
      required: true
  - type: textarea
    id: terminado
    attributes:
      label: ¿Cuándo se considera terminada?
      placeholder: "- [ ] ..."
  - type: input
    id: fecha
    attributes:
      label: Fecha objetivo
      placeholder: "2026-10-29"
