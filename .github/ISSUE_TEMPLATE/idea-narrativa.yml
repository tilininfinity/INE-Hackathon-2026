name: Idea de narrativa
description: Propuesta de hallazgo, mensaje o visualización para la historia.
title: "[Idea] "
labels: ["narrativa"]
body:
  - type: textarea
    id: mensaje
    attributes:
      label: Mensaje o hallazgo
      description: ¿Qué queremos que la ciudadanía entienda?
    validations:
      required: true
  - type: input
    id: publico
    attributes:
      label: Público objetivo
      placeholder: "Jóvenes de 18 a 24 años que votarán por primera vez"
  - type: textarea
    id: datos
    attributes:
      label: Datos que lo sustentan
      description: Indicadores CCPC, elección(es), región(es).
  - type: textarea
    id: visual
    attributes:
      label: ¿Cómo se vería?
      description: Tipo de gráfica, boceto, referencia.
